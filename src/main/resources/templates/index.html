<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Impostinho</title>
	<link rel="stylesheet" th:href="@{index/index.css}">
</head>

<body>

	<header class="barra">

			<span class="logo-texto"><span class="simbolo">+</span>Impos<span>tinho</span></span>
		</div>
		
		<nav class="menu-sistema" sec:authorize="isAuthenticated()" >

						<a th:href="@{/paciente/listar}" sec:authorize="hasAnyRole('ADMIN','ATENDENTE')">Pacientes</a>
						<a th:href="@{/consulta/listar}" sec:authorize="hasAnyRole('ADMIN','USUARIO','ATENDENTE')" >Consultas</a>

						<a th:href="@{/h2-console}" sec:authorize="hasRole('ADMIN')">H2 BD</a>
						
					</nav>
	</header>


	<div class="caixa">
		
<h2>Bem vindo ao Impostinho</h2>

	</div>
  
	<div class="caixa">
  
 </div>
