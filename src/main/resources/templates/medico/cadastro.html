<html>
	
<head><title>Cadastro de Medico</title></head>

<body>
	<h3>Cadastro de Medico</h3>
	
	<form th:action="@{salvar}" method="post" th:Object="${medico}">
		<p>
		<label for="input-nome">Nome: </label>
		<input type="text" id="input-nome" th:field ="*{nome}" placeholder="Digite nome">
		<p>
		<label for="input-cpf">CPF: </label>
		<input type="text" id="input-cpf" th:field ="*{cpf}" maxlength="14" placeholder="Digite CPF">
		<p>
		<label for="input-dataAdmissao">Data de admissao: </label>
		<input type="date" id="input-dataAdmissao" th:field ="*{dataAdmissao}" placeholder="Digite de admissao">
		<p>
			<label for="input-especialidade">Especialidade: </label>
					<input type="text" id="input-especialidade" th:field ="*{especialidade}" placeholder="especialidades do medico">
		<p>
		<input type="submit" value="Salvar">
	</form>

</body>
	
</html>
