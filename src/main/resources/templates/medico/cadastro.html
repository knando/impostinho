<html>
	
<head><title>Cadastro de paciente</title></head>

<body>
	<h3>Cadastro de medico</h3>
	
	<form action="salvar" method="post">
		<p>
		<label for="input-nome">Nome: </label>
		<input type="text" id="input-nome" name="nome" placeholder="Digite nome">
		<p>
		<label for="input-cpf">CPF: </label>
		<input type="text" id="input-cpf" name="cpf" maxlength="14" placeholder="Digite CPF">
		<p>
		<label for="input-data-admissao">Data de admissao: </label>
		<input type="date" id="input-data-admissao" name="data-admissao" placeholder="Digite uma data">
		<p>
		<label for="input-especialidade">Especialidade: </label>
		<input type="date" id="input-especialidade" name="especialidade" placeholder="Digite as especialidades">
		<p>	
		<input type="submit" value="Salvar">
	</form>

</body>
	
</html>
