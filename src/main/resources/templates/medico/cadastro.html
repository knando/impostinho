<html>
	
<head><title>Cadastro de paciente</title></head>

<body>
	<h3>Cadastro de medico</h3>
	
	<form action="salvar" method="post" th:object="${medico}">
		<p>
		<label for="input-nome">Nome: </label>
		<input type="text" id="input-nome" th:field="*{nome}" placeholder="Digite nome">
		<p>
		<label for="input-cpf">CPF: </label>
		<input type="text" id="input-cpf" th:field="*{cpf}" maxlength="11" placeholder="Digite CPF">
		<p>
		<label for="input-data-admissao">Data de admissao: </label>
		<input type="date" id="input-data-admissao" th:field="*{dataAdmissao}" placeholder="Digite uma data">
		<p>
		<label for="input-especialidade">Especialidade: </label>
		<input type="text" id="input-especialidade" th:field="*{especialidade}" placeholder="Digite as especialidades">
		<p>	
		<input type="submit" value="salvar">
	</form>

</body>
	
</html>
