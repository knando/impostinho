<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Listagem de Consultas</title>
	<link rel="stylesheet" th:href="@{/paciente/style.css}">
</head>

<body>
	<header class="barra" style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
			<div class="barra-conteudo">
				<div class="logo"></div>
				<span class="logo-texto"><span class="simbolo">+</span>Impos<span>tinho</span></span>
			</div>
			<!-- Links para as outras duas páginas -->
			<nav class="menu-sistema" style="display: flex; gap: 20px;">
				<a th:href="@{/medico/listar}" style="color: white; text-decoration: none; font-weight: bold; padding: 5px 10px;">Médicos</a>
				<a th:href="@{/paciente/listar}" style="color: white; text-decoration: none; font-weight: bold; padding: 5px 10px;">Pacientes</a>
			</nav>
		</header>
	


	<main class="conteudo-principal">
		<h2>Lista de Consultas</h2>

		<!-- Botão para navegar até o formulário -->
		<div style="margin-bottom: 15px;">
		    <a th:href="@{/consulta/cadastro}" class="btn" style="background-color: #007bff; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block;">+ Nova Consulta</a>
		</div>
		
		<div class="tabela-container">
			<table>
				<thead>
					<tr>
						<th>Horário</th>
						<th>Médico</th>
						<th>Paciente</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="c : ${listaC}">
						<td th:text="${#temporals.format(c.horario, 'dd/MM/yyyy HH:mm')}"></td>
						<td th:text="${c.medico.nome}"></td>
						<td th:text="${c.paciente.nome}"></td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>

	<footer class="rodape">
		<p>&copy; 2026 Impostinho - Sistema de Gestão de Pacientes</p>
	</footer>
</body>

</html>
