<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Listagem de Pacientes</title>
	<link rel="stylesheet" th:href="@{/paciente/style.css}">
</head>

<body>
	<header class="barra" style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
			<div class="barra-conteudo">
				<div class="logo"></div>
				<span class="logo-texto"><span class="simbolo">+</span>Impos<span>tinho</span></span>
			</div>
			<!-- Links para as outras duas páginas -->
			<nav class="menu-sistema" style="display: flex; gap: 20px;">
				<a th:href="@{/medico/listar}" style="color: white; text-decoration: none; font-weight: bold; padding: 5px 10px;">Médicos</a>
				<a th:href="@{/consulta/listar}" style="color: white; text-decoration: none; font-weight: bold; padding: 5px 10px;">Consultas</a>
			</nav>
		</header>

	<main class="conteudo-principal">
		<h2>Lista de Pacientes</h2>
		<div style="margin-bottom: 20px;">
					    <a th:href="@{/paciente/cadastro}" class="btn" style="background-color: #007bff; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block;">+ Novo Paciente</a>
					</div>
		
					<div class="tabela-container">
			
			
			
			<table>
				<thead>
					<tr>
						<th>Nome</th>
						<th>Sexo</th>
						<th>Cpf</th>
						<th>Data de nascimento</th>
						<th>Endereço</th>
						<th>Telefone</th>
						<th>Alergias</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="p : ${listaP}">
						<td th:text="${p.nome}"></td>
						<td th:text="${p.sexo}"></td>
						<td th:text="${p.cpfFormatada}"></td>
						<td th:text="${p.dataNasc}"></td>
						<td th:text="${p.endereco}"></td>
						<td
							th:text="${p.telefone}">
						</td>
						<td th:text="${p.alergia}"></td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>

	<footer class="rodape">
		<p>&copy; 2026 Impostinho - Sistema de Gestão de Pacientes</p>
	</footer>
</body>

</html>
