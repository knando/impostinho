<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Listagem de Pacientes</title>
	<link rel="stylesheet" th:href="@{/css/base.css}">
	<link rel="stylesheet" th:href="@{/css/layout.css}">
	<link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>

	<header class="barra">
	    <div class="barra-conteudo">
	        <div class="logo"></div>
	        <span class="logo-texto"><span class="simbolo">+</span>Impos<span>tinho</span></span>
	    </div>
	    <nav class="menu-sistema">
	        <a th:href="@{/medico/listar}">Médicos</a>
	        <a th:href="@{/consulta/listar}">Consultas</a>
			<a th:href="@{/paciente/listar}">Cadastro</a>
	    </nav>
	</header>
			
	<main class="conteudo-principal">
		<h2>Lista de Pacientes</h2>
		<div class="tabela-container">
			<table>
				<thead>
					<tr>
						<th>Nome</th>
						<th>Sexo</th>
						<th>Cpf</th>
						<th>Data de nascimento</th>
						<th>Endereço</th>
						<th>Telefone</th>
						<th>Alergias</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="p : ${listaP}">
						<td th:text="${p.nome}"></td>
						<td th:text="${p.sexo}"></td>
						<td th:text="${p.cpfFormatada}"></td>
						<td th:text="${p.dataNasc}"></td>
						<td th:text="${p.endereco}"></td>
						<td th:text="${p.telefone}"></td>
						<td th:text="${p.alergia}"></td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
	<footer class="rodape">
		<p>&copy; 2026 Impostinho - Sistema de Gestão de Pacientes</p>
	</footer>
</body>
</html>
