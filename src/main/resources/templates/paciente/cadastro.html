<html>
	
<head><title>Cadastro de paciente</title></head>

<body>
	<h3>Cadastro de paciente</h3>
	
	<form action="salvar" method="post">
		<p>
		<label for="input-nome">Nome: </label>
		<input type="text" id="input-nome" name="nome" placeholder="Digite nome">
		<p>
		<label for="input-cpf">CPF: </label>
		<input type="text" id="input-cpf" name="cpf" maxlength="14" placeholder="Digite CPF">
		<p>
		<label for="input-data-nascimento">Data de nascimento: </label>
		<input type="date" id="input-data-nascimento" name="data-nascimento" placeholder="Digite uma data">
		<p>
		<input type="submit" value="Salvar">
	</form>

</body>
	
</html>
